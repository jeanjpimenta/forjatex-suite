[package]
name = "forjatex"
version = "1.3.0"
description = "ForjaTeX — Cross-platform LaTeX IDE"
authors = ["ForjaTeX Contributors"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
flate2 = "1.0"
base64 = "0.22"
zip = "2.2"
