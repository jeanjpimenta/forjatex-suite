name: Build & Publish ForjaTeX Suite Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build ForjaTeX IDE
        run: |
          npm ci
          npx tauri build --bundles msi,nsis

      - name: Build ForjaTeX App Suite
        working-directory: forjatex-suite
        run: |
          npm install
          npx tauri build --bundles msi,nsis

      - name: Build ForjaTikZ
        working-directory: forjatikz
        run: |
          npm install
          npx tauri build --bundles msi,nsis

      - name: Generate suite-manifest.json
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") { $tag = "v1.0.0" }
          $manifest = @{
            updatedAt = (Get-Date).ToString("o")
            apps = @(
              @{
                id = "forjatex"
                name = "ForjaTeX IDE"
                latestVersion = "1.3.0"
                installerFile = "ForjaTeX_1.3.0_x64-setup.exe"
                installerUrl = "https://github.com/$repo/releases/latest/download/ForjaTeX_1.3.0_x64-setup.exe"
                changelog = "Atualização via GitHub Releases ($tag)"
              },
              @{
                id = "forjatikz"
                name = "ForjaTikZ"
                latestVersion = "1.0.0"
                installerFile = "ForjaTikZ_1.0.0_x64-setup.exe"
                installerUrl = "https://github.com/$repo/releases/latest/download/ForjaTikZ_1.0.0_x64-setup.exe"
                changelog = "Studio Visual TikZ & PGFPlots ($tag)"
              }
            )
          }
          [System.IO.File]::WriteAllText("$PWD\suite-manifest.json", ($manifest | ConvertTo-Json -Depth 4), (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            suite-manifest.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            forjatex-suite/src-tauri/target/release/bundle/nsis/*.exe
            forjatex-suite/src-tauri/target/release/bundle/msi/*.msi
            forjatikz/src-tauri/target/release/bundle/nsis/*.exe
            forjatikz/src-tauri/target/release/bundle/msi/*.msi

