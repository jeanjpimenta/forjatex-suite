name: CI Verify (Windows & Linux)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify ForjaTeX IDE (Frontend + Rust)
        run: |
          npm ci
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Verify ForjaTeX App Suite (Frontend + Rust)
        working-directory: forjatex-suite
        run: |
          npm install
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Verify ForjaTikZ (Frontend + Rust)
        working-directory: forjatikz
        run: |
          npm install
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

